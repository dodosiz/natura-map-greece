name: Bug report
description: Report a problem with the map, API, data pipeline, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected security vulnerabilities, use the private reporting link instead of opening a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Choose the part of Natura Map Greece where you encountered the problem.
      options:
        - Web map
        - API
        - ETL/data pipeline
        - Data
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear, concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page, map actions, API request, or commands involved.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and supporting details
      description: Browser/OS, API response, error message, or screenshot, if relevant. Do not include secrets or personal data.
    validations:
      required: false
